name: Deploy to GitHub Pages

on:
  push:
    branches: ['production']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Set build metadata
        shell: bash
        run: |
          echo "VITE_SITE_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VITE_SITE_UPDATED_AT=$(TZ=America/Sao_Paulo date '+%d/%m/%Y as %H:%M')" >> "$GITHUB_ENV"

      - name: Build
        run: yarn build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
